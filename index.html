<title>出发吧 · 旅行规划师</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦊%3C/text%3E%3C/svg%3E" data-page-node-id="sca7TJ18H0nOY6bHn2vUFi">
<style>
:root{
  --paper:#FFF6E9; --paper2:#FFFDF6; --ink:#5A4632; --ink-soft:#9B8466;
  --coral:#F27A6B; --sage:#7FB17B; --sky:#5BA8D8; --lilac:#A98BD0; --sun:#E9B44C; --mint:#4FB8A8;
  --line:#EAD9BE; --shadow:0 6px 20px rgba(90,70,50,.10);
  --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  color:var(--ink); background:var(--paper);
  overflow:hidden; position:fixed; inset:0; width:100%;
  -webkit-user-select:none; user-select:none;
}
/* ===== 手绘纹理背景 ===== */
#app{
  height:100%; display:flex; flex-direction:column;
  background-image:
    radial-gradient(var(--line) 1.4px, transparent 1.4px),
    radial-gradient(var(--line) 1.4px, transparent 1.4px);
  background-size:26px 26px; background-position:0 0, 13px 13px;
  position:relative; overflow:hidden;
}
/* ===== 通用手绘卡片 ===== */
.hand{border:3px solid var(--ink); background:var(--paper2);}
.hand-a{border-radius:255px 15px 225px 15px / 15px 225px 15px 255px;}
.hand-b{border-radius:15px 225px 15px 255px / 225px 15px 255px 15px;}
.hand-c{border-radius:24px 24px 24px 24px;}
.btn{
  border:3px solid var(--ink); background:var(--paper2); color:var(--ink);
  border-radius:999px; font-weight:700; cursor:pointer; padding:12px 18px;
  font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  box-shadow:0 3px 0 var(--ink); transition:transform .08s ease, box-shadow .08s ease;
  min-height:48px; touch-action:manipulation;
}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink);}
.btn.primary{background:var(--coral); color:#fff;}
.btn.green{background:var(--sage); color:#fff;}
.btn.blue{background:var(--sky); color:#fff;}
.btn.ghost{background:transparent; box-shadow:none; border-style:dashed;}
.btn.sm{padding:7px 12px; min-height:36px; font-size:14px; box-shadow:0 2px 0 var(--ink);}
/* ===== 视图切换 ===== */
.view{position:absolute; inset:0; display:none; flex-direction:column; padding-top:calc(12px + var(--safe-top));}
.view.active{display:flex;}
/* ===== Setup 视图 ===== */
#view-setup{padding:calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom)); overflow-y:auto; gap:14px;}
.mascot-head{display:flex; align-items:center; gap:12px; justify-content:center; flex-direction:column; text-align:center;}
.mascot{font-size:56px; line-height:1; animation:float 3s ease-in-out infinite; display:inline-block;}
.mascot.small{font-size:30px; animation:none;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
.title{font-size:30px; font-weight:900; letter-spacing:1px;}
.subtitle{font-size:14px; color:var(--ink-soft);}
.cloud{position:absolute; font-size:40px; opacity:.7; animation:float 5s ease-in-out infinite;}
@keyframes drift{from{transform:translateX(-20px);}to{transform:translateX(20px);}}
.section-title{font-size:15px; font-weight:800; margin:2px 0 8px; display:flex; align-items:center; gap:6px;}
.field{display:flex; gap:10px; align-items:stretch;}
.field input{
  flex:1; border:3px solid var(--ink); background:#fff; border-radius:16px; padding:12px 14px;
  font-size:16px; color:var(--ink); min-width:0; outline:none;
}
.field input::placeholder{color:#c8b8a0;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:2.5px solid var(--ink); background:#fff; border-radius:999px; padding:9px 14px;
  font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  box-shadow:2px 3px 0 rgba(90,70,50,.15); transition:transform .08s;
}
.chip:active{transform:scale(.94);}
.chip .x{width:20px;height:20px;border-radius:50%;background:var(--coral);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;line-height:1;}
.chip.add{background:var(--sun); color:var(--ink);}
.suggest-label{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.stepper{display:flex; align-items:center; gap:14px; justify-content:center;}
.stepper .num{font-size:30px; font-weight:900; min-width:44px; text-align:center;}
.stepper .btn{width:52px;height:52px;font-size:26px;padding:0;border-radius:18px;}
/* ===== Main 视图 ===== */
#view-main{padding:0; }
.topbar{
  display:flex; align-items:center; gap:10px; padding:calc(10px + var(--safe-top)) 16px 8px;
  background:var(--paper); border-bottom:3px dashed var(--line); z-index:5;
}
.topbar .t-title{font-size:18px; font-weight:900; flex:1; display:flex; align-items:center; gap:8px;}
.daychips{display:flex; gap:8px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; background:var(--paper);}
.daychips::-webkit-scrollbar{display:none;}
.daychip{
  border:2.5px solid var(--ink); border-radius:999px; padding:8px 16px; font-weight:800; font-size:14px;
  white-space:nowrap; cursor:pointer; background:#fff; flex-shrink:0; transition:all .12s;
}
.daychip.active{color:#fff; transform:translateY(-2px); box-shadow:0 3px 0 var(--ink);}
.tab-body{flex:1; position:relative; overflow:hidden;}
.tab{position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto;}
.tab.active{display:flex;}
/* 地图 Tab */
#tab-map{overflow:hidden;}
.map-wrap{flex:1; position:relative; min-height:0;}
#map-container,#mock-map{position:absolute; inset:0;}
#mock-map{width:100%;height:100%;display:block;}
.map-hint{
  position:absolute; top:12px; left:12px; right:12px; z-index:6;
  background:rgba(255,246,233,.95); border:2.5px solid var(--ink); border-radius:14px;
  padding:8px 12px; font-size:12px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;
}
.legend{position:absolute; left:12px; bottom:12px; z-index:6; display:flex; flex-direction:column; gap:6px;}
.legend .lg{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; background:rgba(255,253,246,.92); border:2px solid var(--ink); border-radius:999px; padding:4px 10px;}
.legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--ink);}
/* 行程 Tab */
#tab-itinerary{padding:14px 14px calc(90px + var(--safe-bottom)); gap:14px;}
.day-block{margin-bottom:6px;}
.day-block-head{display:flex; align-items:center; gap:8px; margin:4px 2px 10px; flex-wrap:wrap;}
.day-block-head .dn{font-size:16px; font-weight:900;}
.day-block-head .dn b{font-size:13px;color:var(--ink-soft);font-weight:600;margin-left:4px;}
.it-item{
  display:flex; align-items:center; gap:10px; padding:12px; margin-bottom:10px;
  position:relative; transition:transform .08s;
}
.it-item.dragging{opacity:.9; z-index:20; transform:scale(1.03) rotate(-1deg); box-shadow:0 10px 24px rgba(90,70,50,.2);}
.it-item .drag{font-size:20px; color:var(--ink-soft); cursor:grab; touch-action:none; padding:6px 2px;}
.it-item .seq{
  width:32px;height:32px;border-radius:50%;color:#fff;font-weight:900;font-size:15px;
  display:flex;align-items:center;justify-content:center;border:2.5px solid var(--ink); flex-shrink:0;
}
.it-item .info{flex:1; min-width:0;}
.it-item .info .nm{font-weight:800; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.it-item .info .tm{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.it-item .acts{display:flex; flex-direction:column; gap:5px; align-items:center;}
.it-item .acts .row{display:flex; gap:5px;}
.ibtn{width:34px;height:34px;border-radius:11px;border:2.5px solid var(--ink);background:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.ibtn:active{transform:scale(.9);}
.ibtn.del{color:#fff;background:var(--coral);}
.ibtn.day{font-size:12px;}
.empty{text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:14px;}
/* 攻略 Tab */
#tab-guide{padding:14px 14px calc(90px + var(--safe-bottom)); gap:14px;}
.g-day{margin-bottom:8px;}
.g-day-head{display:flex; align-items:center; gap:10px; margin:8px 2px 10px;}
.g-day-head .gdn{font-size:17px; font-weight:900; display:flex; align-items:center; gap:8px;}
.g-card{padding:16px; margin-bottom:14px;}
.g-card h4{font-size:14px; font-weight:900; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.g-sched{width:100%; border-collapse:collapse; font-size:13px;}
.g-sched td{padding:8px 6px; border-bottom:2px dashed var(--line); vertical-align:top;}
.g-sched td:first-child{font-weight:800; white-space:nowrap; color:var(--ink);}
.g-sched .st{color:var(--ink-soft);}
.g-tag{display:inline-block; border:2px solid var(--ink); background:#fff; border-radius:999px; padding:5px 12px; margin:3px 4px 3px 0; font-size:13px; font-weight:600;}
.g-para{font-size:13px; line-height:1.7; color:var(--ink);}
/* 底部导航 */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:99999;
  display:none; background:var(--paper2); border-top:3px solid var(--ink);
  padding-bottom:var(--safe-bottom); pointer-events:auto;
  transform:translateZ(0); -webkit-transform:translateZ(0);
}
.tabbar.show{display:flex;}
.tabbar .tb{flex:1; text-align:center; padding:10px 0 8px; cursor:pointer; font-size:12px; font-weight:800; color:var(--ink-soft); position:relative;}
.tabbar .tb .ic{font-size:22px; display:block; margin-bottom:2px;}
.tabbar .tb.active{color:var(--coral);}
.tabbar .tb.active::after{content:''; position:absolute; top:-3px; left:30%; right:30%; height:3px; background:var(--coral); border-radius:3px;}
/* 导出按钮区 */
.export-bar{display:flex; gap:10px; padding:4px 2px;}
.export-bar .btn{flex:1;}
/* 底部弹层(添加地点) */
.sheet-mask{position:fixed; inset:0; background:rgba(90,70,50,.35); z-index:50; display:none; align-items:flex-end;}
.sheet-mask.show{display:flex;}
.sheet{
  width:100%; background:var(--paper); border:3px solid var(--ink); border-bottom:none;
  border-radius:26px 26px 0 0; padding:18px 18px calc(20px + var(--safe-bottom));
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet .s-title{font-size:16px; font-weight:900; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
/* Toast */
#toast{
  position:fixed; left:50%; bottom:calc(80px + var(--safe-bottom)); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:700;
  opacity:0; pointer-events:none; transition:all .25s; z-index:99; white-space:nowrap; max-width:90%;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* 模拟地图SVG描边动画 */
.route-line{stroke-dasharray:10 8; animation:dashmove 1.4s linear infinite;}
@keyframes dashmove{to{stroke-dashoffset:-36;}}
.pin-pop{transform-origin:center; animation:pinpop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes pinpop{from{transform:scale(0); opacity:0;}to{transform:scale(1); opacity:1;}}

/* ===== 行程编辑态 ===== */
.it-input{
  font:inherit; color:var(--ink); background:#FFFDF6;
  border:2px solid var(--line); border-radius:10px; padding:6px 8px;
  width:100%; outline:none; transition:border-color .12s;
}
.it-input:focus{border-color:var(--coral);}
.it-name{font-weight:800; font-size:15px; margin-bottom:4px;}
.it-meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; font-size:12px; color:var(--ink-soft);}
.it-meta label{display:inline-flex; align-items:center; gap:4px; background:#FFFDF6; border:2px solid var(--line); border-radius:10px; padding:2px 4px 2px 6px;}
.it-meta .it-input{width:auto; min-width:48px; padding:3px 4px; border:none; background:transparent; font-weight:800; color:var(--ink);}
.it-summary{
  padding:12px; margin:6px 2px 10px;
  background:linear-gradient(180deg,#FFFDF6,#FFF6E9);
  border:2.5px dashed var(--ink); border-radius:14px;
}
.it-summary .it-route{font-size:13px; font-weight:800; color:var(--ink); line-height:1.5;}
.it-summary .it-cost{font-size:13px; color:var(--coral); margin-top:4px;}
.it-summary .it-cost b{font-size:16px;}
.it-grand{
  margin:18px 2px 4px; padding:14px 16px; text-align:center;
  background:var(--ink); color:#fff; border-radius:14px; font-size:15px;
}
.it-grand b{color:#FFD89B; font-size:20px; margin-left:4px;}
.btn.sm{padding:8px 12px; font-size:13px; min-height:34px;}
.btn.blue{background:#5BA8D8; color:#fff;}
.btn.blue:active{background:#3D8DBE;}
</style>
</head>

/* ---------- ⑦ 智能分组算法 ---------- */
// 最远点初始化 + 锚点优先 + 最近邻分配 + 聚类内最近邻排序
function clusterPlan(locs, k){
  const n = locs.length;
  if(n===0) return [];
  k = Math.min(k, n);
  const pts = locs.map((l,i) => ({...l, _i:i}));

  // 锚点（如鼓浪屿）优先成为独立中心
  const centers = [];
  const anchors = pts.filter(p=>p.anchor);
  anchors.forEach(a=>{ if(centers.length<k) centers.push({lat:a.lat,lng:a.lng,id:a.id,anchor:true}); });

  // 最远点采样补齐中心
  while(centers.length < k){
    let best=null, bestD=-1;
    for(const p of pts){
      if(centers.some(c=>c.id===p.id)) continue;
      const d = centers.length ? Math.min(...centers.map(c=>dist(c,p))) : 0;
      if(centers.length===0 || d>bestD){ bestD=d; best=p; if(centers.length===0) break; }
    }
    if(!best) break;
    centers.push({lat:best.lat,lng:best.lng,id:best.id});
  }

  // 分配
  const groups = centers.map(()=>[]);
  pts.forEach(p=>{
    let bi=0, bd=Infinity;
    centers.forEach((c,i)=>{ const d=dist(c,p); if(d<bd){bd=d;bi=i;} });
    groups[bi].push(p);
  });

  // 锚点独占：锚点所在簇只保留锚点本身（若存在非锚点簇可接收溢出）
  const anchorIdx = new Set(centers.map((c,i)=>c.anchor?i:-1).filter(i=>i>=0));
  if(anchorIdx.size>0 && anchorIdx.size<centers.length){
    const nonAnchor = centers.map((c,i)=>i).filter(i=>!anchorIdx.has(i));
    anchorIdx.forEach(ai=>{
      const keep = groups[ai].filter(p=>p.anchor);
      const extra = groups[ai].filter(p=>!p.anchor);
      groups[ai] = keep;
      extra.forEach(p=>{
        let bi=nonAnchor[0], bd=Infinity;
        nonAnchor.forEach(j=>{ const d=dist(centers[j],p); if(d<bd){bd=d;bi=j;} });
        groups[bi].push(p);
      });
    });
  }

  // 软均衡：允许 ceil(n/k)+1 上限
  const cap = Math.ceil(n/k) + 1;
  for(let i=0;i<groups.length;i++){
    while(groups[i].length > cap){
      // 找离中心最远的点移走
      let far=groups[i][0], farD=-1, farIdx=0;
      groups[i].forEach((p,idx)=>{ const d=dist(centers[i],p); if(d>farD){farD=d;far=p;farIdx=idx;} });
      groups[i].splice(farIdx,1);
      // 移到最近的不满簇
      let bi=0, bd=Infinity;
      groups.forEach((g,j)=>{ if(g.length<cap){ const d=dist(centers[j],far); if(d<bd){bd=d;bi=j;} } });
      groups[bi].push(far);
    }
  }

  // 聚类内最近邻排序（从离中心最近的点开始）
  const ordered = groups.map(g=>{
    if(g.length<=1) return g;
    const c = centers[groups.indexOf(g)];
    let cur = g.reduce((a,b)=> dist(c,a)<=dist(c,b)?a:b);
    const rest = g.filter(p=>p!==cur);
    const seq = [cur];
    while(rest.length){
      let nxt=rest[0], nd=Infinity;
      rest.forEach(p=>{ const d=dist(cur,p); if(d<nd){nd=d;nxt=p;} });
      seq.push(nxt); rest.splice(rest.indexOf(nxt),1); cur=nxt;
    }
    return seq;
  });

  // 按“第一个用户输入地点所在簇 = 第1天”，其余按最小输入序号排序
  const order = groups.map((g,gi)=> ({gi, minIdx: g.reduce((m,p)=> Math.min(m, p._i), Infinity) }));
  order.sort((a,b)=>a.minIdx-b.minIdx);
  // 重建
  const result = [];
  order.forEach((o, dayIndex)=>{
    ordered[o.gi].forEach(p=>{ result.push({...p, day: dayIndex}); });
  });
  // 空簇兜底
  for(let d=0; d<k; d++) if(!result.some(r=>r.day===d)){ /* 无 */ }
  return result;
}

function detectCity(){
  const hit = state.locations.filter(l => DB.some(d => d.name === l.name));
  state.city = hit.length ? '厦门' : '目的地';
}
function generatePlan(){
  const locs = state.locations.map(l=>({...l}));
  if(locs.length===0){ toast('先添加几个地点吧～'); return; }
  const grouped = clusterPlan(locs, state.days);
  state.locations = grouped;
  state.activeDay = 0;
  detectCity();
  save();
  mockMapDrawn = false;
  showMain();
}

function dayLocations(d){ return state.locations.filter(l=>l.day===d); }

/* ---------- ⑩ 地图渲染（腾讯地图 或 手绘示意） ---------- */
const MAP_LOAD_TIMEOUT_MS = 8000;
function initRealMap(){
  // 已经构建过真地图：只更新覆盖物
  if(window.__mapBuilt && window.__map){ updateMap(); return; }
  // 正在加载中：不要重复插入 script
  if(window.__mapLoading) return;
  // 已确认失败 / 走 fallback 路线
  if(window.__mapFailed){ fallbackToMock(); return; }

  $('#mock-map').style.display='none';
  $('#map-container').style.display='block';

  if(window.TMap){ buildRealMap(); return; }

  window.__mapLoading = true;
  const timer = setTimeout(()=>{
    if(!window.__mapBuilt){
      window.__mapFailed = true; window.__mapLoading = false;
      toast('地图加载超时，自动切换为手绘示意');
      fallbackToMock();
    }
  }, MAP_LOAD_TIMEOUT_MS);

  const s = document.createElement('script');
  s.src = `https://map.qq.com/api/gljs?v=1.exp&key=${TENCENT_MAP_KEY}&libraries=service`;
  s.onload = ()=>{ clearTimeout(timer); window.__mapLoading = false; buildRealMap(); };
  s.onerror = ()=>{ clearTimeout(timer); window.__mapFailed = true; window.__mapLoading = false; toast('地图加载失败，自动切换为手绘示意'); fallbackToMock(); };
  document.head.appendChild(s);
}
function fallbackToMock(){
  $('#map-container').style.display='none';
  $('#map-container').innerHTML='';
  $('#mock-map').style.display='block';
  try{renderMockMap();}catch(e){}
}
function makePinSVG(color, num){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="56" viewBox="0 0 44 56">
    <path d="M22 2C11 2 3 10 3 21c0 14 19 33 19 33s19-19 19-33C41 10 33 2 22 2z" fill="${color}" stroke="#5A4632" stroke-width="2.5"/>
    <circle cx="22" cy="20" r="11" fill="#fff" stroke="#5A4632" stroke-width="2"/>
    <text x="22" y="26" font-size="15" font-weight="900" text-anchor="middle" fill="#5A4632" font-family="sans-serif">${num}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function buildRealMap(){
  if(window.__mapBuilt && window.__map){ updateMap(); return; }
  try{
    const el = $('#map-container');
    el.innerHTML = '';
    const pts = state.locations;
    const center = pts[0] ? new TMap.LatLng(pts[0].lat, pts[0].lng) : new TMap.LatLng(24.45,118.09);
    const map = new TMap.Map(el, { center, zoom: 12, viewMode:'2D', baseMap: { type:'vector' } });
    window.__map = map;
    window.__mapBuilt = true;
    updateMap();
  }catch(e){
    console.warn('TMap init failed', e);
    window.__mapFailed = true; window.__mapBuilt = false;
    fallbackToMock();
  }
}
function updateMap(){
  const map = window.__map;
  if(!map) return;
  try{
    // 销毁旧的覆盖物，避免重复叠加导致卡顿
    if(window.__markerLayer){ try{window.__markerLayer.setMap(null);}catch(e){} window.__markerLayer=null; }
    if(window.__lineLayer){  try{window.__lineLayer.setMap(null);}catch(e){}  window.__lineLayer=null;  }
    const pts = state.locations;
    if(!pts.length) return;
    // 标记
    const layerGeos = { styles:{}, geometries:[] };
    const lineStyles = {}; const lineGeoms = [];
    const bounds = new TMap.LatLngBounds();
    pts.forEach((p, i)=>{
      const c = colorOf(p.day);
      const sid = 's'+p.id;
      layerGeos.styles[sid] = new TMap.MarkerStyle({ width:44, height:56, anchor:{x:22,y:52}, src: makePinSVG(c, i+1) });
      layerGeos.geometries.push({ id:'p'+p.id, styleId:sid, position:new TMap.LatLng(p.lat,p.lng) });
      bounds.extend(new TMap.LatLng(p.lat,p.lng));
    });
    window.__markerLayer = new TMap.MultiMarker({ map, ...layerGeos });
    // 连线（按天）
    const byDay = {};
    pts.forEach(p=> (byDay[p.day]=byDay[p.day]||[]).push(p));
    Object.keys(byDay).forEach(d=>{
      const c = colorOf(+d);
      const paths = byDay[d].map(p=> new TMap.LatLng(p.lat,p.lng));
      if(paths.length>=2){
        lineStyles['line'+d] = new TMap.PolylineStyle({ color:c, width:6, borderWidth:0, lineCap:'round' });
        lineGeoms.push({ id:'l'+d, styleId:'line'+d, paths });
      }
    });
    if(lineGeoms.length) window.__lineLayer = new TMap.MultiPolyline({ map, styles:lineStyles, geometries:lineGeoms });
    if(pts.length) map.fitBounds(bounds, { padding: 60 });
  }catch(e){
    console.warn('updateMap failed', e);
    window.__mapFailed = true;
    fallbackToMock();
  }
}
function renderMap(){
  $('#map-hint-text').textContent = TENCENT_MAP_KEY
    ? (window.__mapFailed ? '地图加载失败，已自动切换为手绘示意' : '已配置地图Key · 腾讯地图') : '演示模式：未配置地图Key，显示手绘示意地图';
  if(TENCENT_MAP_KEY && !window.__mapFailed){
    initRealMap();
  } else {
    fallbackToMock();
  }
  renderLegend();
}
function renderLegend(){
  const el = $('#legend');
  if(state.locations.length===0){ el.innerHTML=''; return; }
  // 显示选中天的图例
  const d = state.activeDay;

/* 手绘示意地图 */
function renderMockMap(){
  const svg = $('#mock-map');
  const pts = state.locations;
  if(pts.length===0){
    svg.innerHTML = `<rect width="1000" height="1000" fill="#DFF0F7"/>
      <text x="500" y="470" font-size="40" text-anchor="middle" fill="#5A4632">🗺</text>
      <text x="500" y="540" font-size="26" text-anchor="middle" fill="#9B8466">添加地点后，这里会画出</text>
      <text x="500" y="580" font-size="26" text-anchor="middle" fill="#9B8466">手绘路线示意图</text>`;
    return;
  }
  const lats = pts.map(p=>p.lat), lngs = pts.map(p=>p.lng);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const spanLat = (maxLat-minLat)||0.01, spanLng=(maxLng-minLng)||0.01;
  const W=1000,H=1000,pad=120;
  const X = lng => pad + (lng-minLng)/spanLng*(W-2*pad);
  const Y = lat => pad + (maxLat-lat)/spanLat*(H-2*pad);

  let out = [];
  // 海面 + 岛屿
  out.push(`<rect width="1000" height="1000" fill="#DCEFF7"/>`);
  // 波浪
  for(let y=0;y<H;y+=70){ out.push(`<path d="M0 ${y} q 60 -16 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0" fill="none" stroke="#BFE0EE" stroke-width="8" stroke-linecap="round" opacity=".6"/>`); }
  // 岛屿主体
  out.push(`<path d="M120 250 Q 500 120 860 240 Q 930 500 860 760 Q 500 900 150 770 Q 70 520 120 250 Z" fill="#F4EBCF" stroke="#5A4632" stroke-width="10" stroke-linejoin="round" stroke-dasharray="0"/>`);
  out.push(`<path d="M140 255 Q 500 140 840 255 Q 905 500 840 745 Q 500 875 165 755 Q 95 520 140 255 Z" fill="none" stroke="#5A4632" stroke-width="4" stroke-dasharray="12 10" opacity=".55"/>`);
  // 绿地斑块
  out.push(`<path d="M220 300 q 90 -60 200 -20 q 60 40 20 110 q -80 60 -200 10 q -60 -50 -20 -100 Z" fill="#E2EDC2" stroke="#9FB67F" stroke-width="5" opacity=".9"/>`);
  out.push(`<path d="M600 520 q 100 -50 220 0 q 50 40 0 110 q -120 40 -220 -30 q -50 -40 0 -80 Z" fill="#D8E9C8" stroke="#9FB67F" stroke-width="5" opacity=".9"/>`);
  // 装饰：太阳、云、树
  out.push(`<circle cx="860" cy="130" r="46" fill="#FFD66B" stroke="#5A4632" stroke-width="6"/>`);
  out.push(`<g stroke="#5A4632" stroke-width="6" fill="none" stroke-linecap="round"><path d="M860 56 v-22 M860 204 v22 M786 130 h-22 M934 130 h22"/></g>`);
  out.push(`<g fill="#fff" stroke="#5A4632" stroke-width="5"><path d="M180 150 a30 30 0 0 1 30 -22 a38 38 0 0 1 68 -8 a30 30 0 0 1 38 26 a26 26 0 0 1 2 60 h-138 a24 24 0 0 1 0 -56 Z"/></g>`);
  // 按天连线
  const byDay={}; pts.forEach(p=> (byDay[p.day]=byDay[p.day]||[]).push(p));
  Object.keys(byDay).forEach(d=>{
    const arr = byDay[d]; const c=colorOf(+d);
    if(arr.length<2) return;
    const ps = arr.map(p=>`${X(p.lng)},${Y(p.lat)}`).join(' ');
    out.push(`<polyline points="${ps}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".5" class="route-line"/>`);
    out.push(`<polyline points="${ps}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`);
  });
  // 标记
  pts.forEach((p,i)=>{
    const c=colorOf(p.day), cx=X(p.lng), cy=Y(p.lat);
    const delay = i*0.06;
    out.push(`<g class="pin-pop" style="animation-delay:${delay}s" transform="translate(${cx},${cy})">
      <path d="M0 0 C -26 -10 -26 -30 0 -42 C 26 -30 26 -10 0 0 Z" fill="${c}" stroke="#5A4632" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="-22" r="15" fill="#fff" stroke="#5A4632" stroke-width="3.5"/>
      <text x="0" y="-16" font-size="18" font-weight="900" text-anchor="middle" fill="#5A4632" font-family="sans-serif">${i+1}</text>
    </g>`);
    // 地名标签
    out.push(`<rect x="${cx-58}" y="${cy+14}" width="116" height="30" rx="15" fill="rgba(255,253,246,.95)" stroke="#5A4632" stroke-width="3"/>
      <text x="${cx}" y="${cy+35}" font-size="17" font-weight="700" text-anchor="middle" fill="#5A4632">${esc(p.name.length>6?p.name.slice(0,6):p.name)}</text>`);
  });
  svg.innerHTML = out.join('');
}

function fmtTime(h){ return String(Math.floor(h)).padStart(2,'0') + ':' + String(Math.round((h%1)*60)).padStart(2,'0'); }
function scheduleFor(dayLocs){
  // 生成当日时间轴：9:00 出发
  let t = 9.0; const sched=[];
  dayLocs.forEach((l,i)=>{
    const start=t;
    const dur = l.dur || 2;
    sched.push({ name:l.name, start:fmtTime(start), end:fmtTime(start+dur), dur });
    t = start + dur + 0.5; // 0.5h 通勤
  });
  return sched;
}

function updateField(id, key, val){
  const l = state.locations.find(x=>x.id===id);
  if(!l) return;
  l[key] = val;
  save();
}

/* 最近邻 TSP 排序：固定起点 = 数组当前第一个，其余用最近邻 */
function reorderByDistance(day){
  const same = state.locations.filter(l=>l.day===day);
  if(same.length < 2) return;
  // 保留第一个不动（用户选择起点），其它按最近邻访问
  const start = same[0];
  const rest = same.slice(1).slice();
  const seq = [start];
  let cur = start;
  while(rest.length){
    let nxt = rest[0], bd = Infinity;
    rest.forEach(p=>{ const d=dist(cur,p); if(d<bd){bd=d;nxt=p;} });
    seq.push(nxt);
    rest.splice(rest.indexOf(nxt),1);
    cur = nxt;
  }
  // 把新顺序写回 state.locations（同一天内）
  const others = state.locations.filter(l=>l.day!==day);
  const reordered = others.concat(seq);
  // 保持其它天的相对顺序稳定：把同天的新顺序插回原范围
  const firstIdx = state.locations.findIndex(l=>l.day===day);
  const before = state.locations.slice(0, firstIdx);
  const after  = state.locations.slice(firstIdx + same.length);
  state.locations = before.concat(seq).concat(after);
  save();
}
function resetDayOrder(day){
  // 恢复 DB 中默认顺序（按输入顺序）：当前 state.locations 中同一天的相对顺序维持不变
  // 这里简单按"从 DB 查到的默认顺序"重排
  const same = state.locations.filter(l=>l.day===day);
  const dbOrder = DB.map(d=>d.name);
  same.sort((a,b)=> dbOrder.indexOf(a.name) - dbOrder.indexOf(b.name));
  const firstIdx = state.locations.findIndex(l=>l.day===day);
  const before = state.locations.slice(0, firstIdx);
  const after  = state.locations.slice(firstIdx + same.length);
  state.locations = before.concat(same).concat(after);
  save();
}
function moveItem(id, dir){
  const idx = state.locations.findIndex(l=>l.id===id);
  if(idx<0) return;
  const day = state.locations[idx].day;
  const same = state.locations.map((l,i)=>({l,i})).filter(o=>o.l.day===day);
  const pos = same.findIndex(o=>o.l.id===id);
  const target = pos + dir;
  if(target<0 || target>=same.length) return;
  const a = state.locations[same[pos].i], b = state.locations[same[target].i];
  state.locations[same[pos].i] = b; state.locations[same[target].i] = a;
  save(); renderAll();
}
function moveItemToNextDay(id){
  const idx = state.locations.findIndex(l=>l.id===id);
  if(idx<0) return;
  const l = state.locations[idx];
  const nd = (l.day + 1) % state.days;
  l.day = nd;
  // 移到数组末尾，作为新一天的末尾项
  state.locations.splice(idx,1); state.locations.push(l);
  save(); renderAll(); toast(l.name+' → '+DAY_NAMES[nd]);
}
/* 触屏拖拽排序 */
function bindDrag(){
  const list = $('#itinerary-list');
  let dragEl=null, startX=0, startY=0, ghost=null;
  list.querySelectorAll('.drag').forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      dragEl = h.closest('.it-item'); if(!dragEl) return;
      e.preventDefault();
      startX=e.clientX; startY=e.clientY; ghost=null;
      dragEl.classList.add('dragging');
      dragEl.setPointerCapture(e.pointerId);
    });
    h.addEventListener('pointermove', e=>{
      if(!dragEl) return;
      const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.it-item');
      if(over && over!==dragEl){
        const listEl = dragEl.parentElement;
        // 判断拖到目标上方还是下方
        const r = over.getBoundingClientRect();
        const mid = r.top + r.height/2;
        if(e.clientY < mid) listEl.insertBefore(dragEl, over);
        else listEl.insertBefore(dragEl, over.nextSibling);
      }
    });
    const end = e=>{
      if(!dragEl) return;
      dragEl.classList.remove('dragging');
      // 依据 DOM 顺序更新 state.locations
      const ids = $$('#itinerary-list .it-item').map(x=>x.dataset.id);
      const map = {}; state.locations.forEach(l=>map[l.id]=l);
      state.locations = ids.map(id=>map[id]).filter(Boolean);
      dragEl=null; save(); renderAll();
    };
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  });
}

    const sched = scheduleFor(locs);

      const fh = 84;
      parts.push(`<rect x="18" y="${y}" width="${W-36}" height="${fh}" rx="18" fill="#FFF6E9" stroke="#5A4632" stroke-width="4"/>`);
      parts.push(`<text x="36" y="${y+38}" font-size="23" font-weight="800" fill="#5A4632">🍜 美食：</text>`);
      parts.push(`<text x="36" y="${y+70}" font-size="20" fill="#5A4632">${foods.map(svgEsc).join(' · ')}</text>`);
      y += fh + 12;
    }
    y += 14;
  });
  // 底部
  const fh = 90;
  parts.push(`<rect x="18" y="${y}" width="${W-36}" height="${fh}" rx="22" fill="#FFD66B" stroke="#5A4632" stroke-width="5"/>`);
  parts.push(`<text x="40" y="${y+56}" font-size="30">🧭</text>`);
  parts.push(`<text x="92" y="${y+58}" font-size="24" font-weight="800" fill="#5A4632">祝旅途愉快，一路生花！</text>`);
  y += fh + 30;

  return { svg: parts.join(''), height: y };
}
function exportToPNG(title, daysArray, colorIdx){
  const card = buildCardSVG(title, daysArray, colorIdx);
  const full = `<svg xmlns="http://www.w3.org/2000/svg" width="760" height="${card.height}" font-family="PingFang SC, Microsoft YaHei, sans-serif">`+card.svg+`</svg>`;
  const img = new Image();
  img.onload = ()=>{
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = 760*scale; canvas.height = card.height*scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale,scale);
    ctx.fillStyle = '#FFFDF6'; ctx.fillRect(0,0,760,card.height);
    ctx.drawImage(img,0,0,760,card.height);
    canvas.toBlob(blob=>{
      if(!blob){ toast('导出失败'); return; }
      const file = new File([blob], title+'.png', {type:'image/png'});
      shareOrDownload(file, blob);
    },'image/png');
  };
  img.onerror = ()=> toast('图片生成失败');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(full);
}
function shareOrDownload(file, blob){
  const url = URL.createObjectURL(blob);
  const nav = navigator;
  if(nav.share && nav.canShare && nav.canShare({files:[file]})){
    nav.share({ files:[file], title:file.name }).catch(()=>download(url,file.name));
  } else if(/iP(hone|ad|od)/.test(navigator.userAgent)){
    // iOS：无分享文件能力时开新窗口长按保存
    window.open(url,'_blank');
    toast('图片已打开，长按即可保存到相册');
  } else {
    download(url, file.name);
  }
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}
function download(url, name){
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  toast('图片已导出 📸');
}
$('#btn-export-all').onclick = ()=>{
  const days = [];
  for(let d=0; d<state.days; d++){ const l=dayLocations(d); if(l.length) days.push(l); }
  if(!days.length){ toast('没有可导出的行程'); return; }
  exportToPNG('我的旅行攻略', days);
};
function exportSingleDay(day){
  const locs = dayLocations(day);
  if(!locs.length){ toast('这天没有行程'); return; }
  exportToPNG(DAY_NAMES[day]+'攻略', [locs], day);
}

/* ---------- ⑮ 全局渲染 ---------- */
function renderAll(){ renderDayChips(); renderMap(); renderItinerary(); renderGuide(); }

/* ---------- ⑯ PWA 安装（单文件最佳努力） ---------- */
function setupPWA(){
  try{
    const manifest = {
      name:'出发吧 · 旅行规划师', short_name:'出发吧', display:'standalone',
      start_url: location.href, background_color:'#FFF6E9', theme_color:'#FFF6E9',
      icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🦊</text></svg>'), sizes:'any', type:'image/svg+xml'}]
    };
    const link = document.createElement('link');
    link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }catch(e){}
}

/* ---------- ⑰ 初始化 + 事件绑定 ---------- */
let __inited = false;
function init(){
  if(__inited) return;
  __inited = true;
  setupPWA();
  load();
  // 兼容旧数据：没有 cost 字段时默认 0
  state.locations.forEach(l=>{ if(typeof l.cost!=='number') l.cost = 0; });
  if(state.activeDay < 0 || state.activeDay >= state.days) state.activeDay = 0;
  // 把底部导航挂到 body 下，彻底脱离地图 DOM 树的影响
  document.body.appendChild($('.tabbar'));
  renderSetup();
  renderSuggest();
  // 如果已有行程，直接进主界面
  if(state.locations.length){ showMain(); }

  $('#btn-add').onclick = addFromInput;
  $('#loc-input').addEventListener('keydown', e=>{ if(e.key==='Enter') addFromInput(); });
  $('#day-minus').onclick = ()=>{ if(state.days>1){ state.days--; save(); renderSetup(); } };
  $('#day-plus').onclick  = ()=>{ if(state.days<8){ state.days++; save(); renderSetup(); } };
  $('#btn-generate').onclick = generatePlan;
  $('#btn-back').onclick = backToSetup;
  $$('.tabbar .tb').forEach(b=> b.onclick=()=>switchTab(b.dataset.tab));

  // 单天导出按钮（行程页顶部常驻一个）
  const itin = $('#itinerary-list');
  const obs = new MutationObserver(()=>{});
  obs.observe(itin, {childList:true});
}
document.addEventListener('DOMContentLoaded', init);
